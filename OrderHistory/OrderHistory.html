<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="orderhistory.css">
</head>

<body>

<header class="navbar">
  <h1>Order History</h1>
  <a href="../Main-Page/MainPage.html" class="back-btn">← Back to Main Page</a>
</header>

<section class="controls">
  <label>
    Filter by Hawker:
    <select id="hawkerFilter">
      <option value="all">All</option>
      <option value="Maxwell Food Centre">Maxwell Food Centre</option>
      <option value="Lau Pa Sat">Lau Pa Sat</option>
      <option value="Chinatown Complex">Chinatown Complex</option>
    </select>
  </label>

  <button id="clearOrders" class="clear-btn">Clear Order History</button>
</section>

<section id="orderHistoryContainer" class="order-grid"></section>

<!-- Modal -->
<div id="orderModal" class="modal hidden">
  <div class="modal-content">
    <span id="closeModal">&times;</span>
    <h2>Order Details</h2>
    <div id="modalBody"></div>
  </div>
</div>

<script src="OrderHistory.js"></script>
</body>
</html>
